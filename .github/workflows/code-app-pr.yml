name: Code App build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run repair:connectors
      - run: npm test
      - run: npm run lint
      - name: Build with live data configuration
        run: npm run build
        env:
          VITE_DATA_SOURCE: api
      - name: Save build for solution packaging
        if: github.event_name == 'push' || github.event.pull_request.head.repo.id == github.event.repository.id
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-app-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Record the release tag
        if: github.event_name == 'push'
        run: printf '%s\n' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/code-app-release-tag.txt"
      - name: Save the release tag for the trusted export workflow
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-app-release-tag-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/code-app-release-tag.txt
          if-no-files-found: error
          retention-days: 7
