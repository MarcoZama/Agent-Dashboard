name: Code App managed solution

on:
  workflow_run:
    workflows: [Code App build]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  export:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push') &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_ROOT: ${{ github.workspace }}/.ci-package
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_commit: ${{ steps.release.outputs.commit }}
    steps:
      # workflow_run checks out the default branch, not the PR. The artifact is never executed here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event.workflow_run.event == 'push' && '0' || '1' }}
          persist-credentials: false
      - name: Download the upstream release tag
        if: github.event.workflow_run.event == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-app-release-tag-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/code-app-release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify the release tag and its ancestry on main
        id: release
        if: github.event.workflow_run.event == 'push'
        env:
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $tagPath = Join-Path $env:RUNNER_TEMP 'code-app-release/code-app-release-tag.txt'
          $tag = (Get-Content -Raw -LiteralPath $tagPath).Trim()
          if ($tag -cnotmatch '^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$') {
            throw 'Expected a release tag in the form vX.Y.Z.'
          }
          $version = '{0}.{1}.{2}.0' -f [uint16]$Matches[1], [uint16]$Matches[2], [uint16]$Matches[3]
          $commit = git --no-pager rev-parse --verify "refs/tags/${tag}^{commit}"
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:BUILD_COMMIT) {
            throw 'The release tag does not point to the commit built by the upstream workflow.'
          }
          git --no-pager merge-base --is-ancestor $commit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The tagged commit must be on main.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @("tag=$tag", "commit=$commit", "version=$version")
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install Power Platform CLI
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'pac-tools'
          dotnet tool install Microsoft.PowerApps.CLI.Tool --version 2.12.2 --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { throw 'Power Platform CLI installation failed.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolPath
      - name: Download build from the successful upstream run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-app-build-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ env.PACKAGE_ROOT }}/dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Pack and verify the managed solution offline
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          if (!$version) {
            $version = '1.0.{0}.{1}' -f [uint16]$env:GITHUB_RUN_NUMBER, [uint16]$env:GITHUB_RUN_ATTEMPT
          }
          .\scripts\Pack-CodeAppSolution.ps1 `
            -BuildDirectory (Join-Path $env:PACKAGE_ROOT 'dist') `
            -SolutionZip (Join-Path $env:PACKAGE_ROOT 'AgentsDashboard_managed.zip') `
            -Version $version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AgentsDashboard-managed-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
          path: ${{ env.PACKAGE_ROOT }}/AgentsDashboard_managed.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: export
    if: needs.export.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified managed solution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AgentsDashboard-managed-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-solution
      - name: Publish the verified ZIP to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.export.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.export.outputs.release_commit }}
        run: |
          $tag = $env:RELEASE_TAG
          $ref = "refs/tags/$tag"
          $refs = @(git --no-pager ls-remote "${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}.git" $ref "${ref}^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not confirm the release tag.' }
          $target = $refs | Where-Object { ($_ -split "`t", 2)[1] -ceq "${ref}^{}" } | Select-Object -First 1
          if (!$target) {
            $target = $refs | Where-Object { ($_ -split "`t", 2)[1] -ceq $ref } | Select-Object -First 1
          }
          if (!$target -or ($target -split "`t", 2)[0] -cne $env:RELEASE_COMMIT) {
            throw 'The release tag no longer points to the commit that produced the managed solution.'
          }
          $asset = Join-Path $env:RUNNER_TEMP 'managed-solution/AgentsDashboard_managed.zip'
          if (!(Test-Path -LiteralPath $asset -PathType Leaf)) { throw 'The verified ZIP is missing.' }
          gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --verify-tag --title "Agents Dashboard $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
